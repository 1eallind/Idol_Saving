html = r'''<!DOCTYPE html>

<style>

  --pink:#ff4eaa;--pink-soft:#ffe5f3;--blue:#4d8dff;--blue-soft:#e6efff;

  --shadow:0 18px 50px rgba(35,47,78,.09);
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(circle at 12% 0%,rgba(255,78,170,.08),transparent 27rem),

  color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}

.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.02em}
.brand-mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 6px 16px rgba(255,78,170,.22)}
.brand small{display:block;font-size:9px;letter-spacing:.18em;color:var(--muted);font-weight:800;margin-top:2px}

.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}

.eyebrow{font-size:10px;letter-spacing:.19em;text-transform:uppercase;font-weight:900;color:var(--blue)}
h1,h2,h3,p{margin-top:0}

p{line-height:1.65}

.small{font-size:12px}
.tiny{font-size:10px}

.btn:hover{transform:translateY(-1px)}
.btn-primary{color:white;background:linear-gradient(105deg,var(--pink),#ff6db8 48%,var(--blue));box-shadow:0 8px 20px rgba(255,78,170,.22)}

.btn-blue{color:#fff;background:var(--blue);box-shadow:0 7px 18px rgba(77,141,255,.18)}
.btn-soft{color:var(--ink);background:#f2f5fb;border:1px solid var(--line)}
.btn-outline{color:var(--blue);background:#fff;border:1px solid #b9d0ff}

.panel{background:rgba(255,255,255,.92);border:1px solid rgba(215,222,235,.95);border-radius:20px;box-shadow:var(--shadow)}
.panel-pad{padding:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}

/* Start */
.start-page{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:32px 20px}
.start-shell{width:min(1100px,100%);min-height:580px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;border-radius:30px;background:#fff;box-shadow:0 30px 90px rgba(40,50,90,.14);border:1px solid #e2e6f0}
.start-copy{padding:clamp(30px,6vw,76px);display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.logo-title{font-weight:1000;font-size:clamp(56px,8vw,98px);line-height:.92;letter-spacing:-.08em;margin:22px 0 18px}
.logo-title .line1{display:block;color:var(--ink)}
.logo-title .line2{display:block;background:linear-gradient(100deg,var(--pink) 8%,#bb63d9 47%,var(--blue) 88%);color:transparent;background-clip:text;-webkit-background-clip:text}
.logo-sub{font-size:10px;letter-spacing:.28em;font-weight:900;color:#8791a9}
.start-art{position:relative;min-height:430px;background:linear-gradient(145deg,#f9fbff,#eaf1ff 52%,#fff0f8);overflow:hidden;display:grid;place-items:center}
.orbit{position:absolute;border:1px solid rgba(77,141,255,.3);border-radius:50%;width:420px;height:420px;transform:rotate(-25deg)}
.orbit.two{width:320px;height:470px;border-color:rgba(255,78,170,.34);transform:rotate(35deg)}
.disc{width:260px;height:260px;border-radius:50%;background:conic-gradient(from 15deg,#fff 0 12%,#fbd4e9 15%,#fff 28%,#c8d9ff 44%,#fff 57%,#f9c3e2 73%,#fff 86%);box-shadow:0 25px 60px rgba(74,104,180,.2);position:relative;display:grid;place-items:center;border:1px solid #fff}
.disc:before{content:"";width:80px;height:80px;border-radius:50%;background:#fff;border:1px solid #dce3f3;box-shadow:inset 0 0 0 17px #f4f6fb}
.disc:after{content:"";position:absolute;width:145px;height:2px;background:var(--pink);transform:rotate(-35deg);box-shadow:0 0 15px rgba(255,78,170,.6)}
.star{position:absolute;color:var(--pink);font-size:36px;font-weight:900}
.star.s1{top:19%;right:18%}.star.s2{bottom:20%;left:15%;color:var(--blue);font-size:24px}
.art-caption{position:absolute;bottom:25px;right:28px;font-size:10px;letter-spacing:.16em;font-weight:900;color:#7d89a5}
.start-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}
.start-note{margin-top:28px;font-size:11px;color:#8a93a8;max-width:400px}
/* Workbench */
.work-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
.work-head h1{font-size:34px;margin:5px 0}
.head-stats{display:flex;gap:8px;flex-wrap:wrap}
.mini-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-width:105px}
.mini-stat span{display:block;color:var(--muted);font-size:10px;font-weight:800}
.mini-stat strong{display:block;font-size:19px;margin-top:3px}
.work-grid{display:grid;grid-template-columns:minmax(240px,.85fr) minmax(360px,1.35fr) minmax(250px,.85fr);gap:16px;align-items:stretch}
.col-stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stat-card{padding:17px 18px}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.stat-row strong{font-size:18px}
.stat-card .desc{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.schedule-list{display:flex;flex-direction:column;gap:8px}
.schedule-row{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:9px;border:1px solid #e5e9f1;border-radius:12px;padding:10px;background:#fff}
.schedule-time{font-size:10px;font-weight:900;color:#78839b}
.schedule-name{font-size:12px;font-weight:850}
.schedule-state{font-size:10px;color:var(--muted)}
.schedule-row.done{background:#f5f8ff;border-color:#d6e4ff}
.schedule-row.done .schedule-name{color:#6078ac}
.schedule-row.active{border-color:#ff9bce;background:#fff6fb;box-shadow:0 0 0 2px rgba(255,78,170,.06)}
.schedule-row.fixed{background:#f1f6ff;border-color:#cbdcff}
.state-tag{font-size:9px;font-weight:900;border-radius:7px;padding:5px 7px;background:#f0f2f7;color:#7c879e;white-space:nowrap}
.done .state-tag{background:#dfeaff;color:#4876d5}.active .state-tag{background:#ffe0ef;color:#d6388c}.fixed .state-tag{background:#dce9ff;color:#386fd1}
.stage-card{position:relative;overflow:hidden;min-height:410px;background:linear-gradient(155deg,#fdfdff 0%,#edf3ff 53%,#fff0f8 100%);display:flex;flex-direction:column}
.stage-top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0;position:relative;z-index:2}
.live-badge{background:#ff4eaa;color:#fff;font-size:10px;font-weight:900;padding:6px 9px;border-radius:7px;letter-spacing:.08em}
.stage-window{flex:1;min-height:280px;display:grid;place-items:center;position:relative;overflow:hidden}
.stage-window:before,.stage-window:after{content:"";position:absolute;border:1px solid rgba(100,132,204,.25);border-radius:50%;width:290px;height:290px}
.stage-window:after{width:370px;height:370px;border-color:rgba(255,78,170,.23)}
.avatar-halo{position:absolute;width:205px;height:205px;border-radius:50%;background:linear-gradient(135deg,#d7e5ff,#ffe0f0);box-shadow:0 20px 55px rgba(80,105,175,.18)}
.avatar{position:relative;z-index:1;width:148px;height:206px}
.avatar-hair{position:absolute;left:19px;top:7px;width:110px;height:100px;border-radius:48% 48% 35% 35%;background:linear-gradient(120deg,#fff 0%,#dfe6f6 52%,#fff 100%);border:2px solid #a9b4cc;box-shadow:0 3px 0 #fff}
.avatar-hair:before,.avatar-hair:after{content:"";position:absolute;top:42px;width:39px;height:112px;border-radius:40px 40px 28px 28px;background:linear-gradient(90deg,#fff,#d5def1);border:2px solid #a9b4cc}
.avatar-hair:before{left:-24px;transform:rotate(7deg)}.avatar-hair:after{right:-24px;transform:rotate(-7deg)}
.avatar-face{position:absolute;left:39px;top:31px;width:70px;height:82px;border-radius:44% 44% 47% 47%;background:#ffe8e5;border:2px solid #a9b4cc;z-index:2}
.avatar-face:before{content:"•   •";position:absolute;left:17px;top:31px;color:#8c6a9f;white-space:pre;font-size:15px;letter-spacing:5px}
.avatar-face:after{content:"⌣";position:absolute;left:27px;top:47px;color:#db6c98;font-size:20px}
.avatar-body{position:absolute;z-index:1;left:20px;top:107px;width:108px;height:100px;border-radius:40px 40px 12px 12px;background:linear-gradient(110deg,#fff 0 42%,#e3edff 43% 72%,#ffd9ec 73%);border:2px solid #a9b4cc}
.avatar-bow{position:absolute;z-index:4;top:24px;left:12px;width:30px;height:18px;background:var(--pink);clip-path:polygon(0 0,48% 25%,100% 0,84% 100%,50% 65%,12% 100%)}
.avatar-crown{position:absolute;z-index:5;top:-8px;left:55px;color:#e5b742;font-size:24px;text-shadow:0 2px #fff}
.stage-name{position:absolute;bottom:18px;left:20px;font-weight:900;font-size:12px;z-index:3}
.stage-name small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;margin-top:3px}
.stage-bottom{padding:15px 18px;border-top:1px solid rgba(210,220,239,.8);display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.65)}
.trend{font-size:11px;line-height:1.55;color:#69748e}
.trend strong{color:var(--ink)}
.action-options{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.action-choice{padding:13px 12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;transition:.15s}
.action-choice:hover{border-color:#9cbaff;background:#f8faff;transform:translateY(-1px)}
.action-choice:disabled{opacity:.4;cursor:not-allowed;transform:none}
.action-choice strong{display:block;font-size:12px;margin-bottom:5px}
.action-choice span{display:block;font-size:10px;color:var(--muted);line-height:1.45}
.context-card{padding:18px;background:linear-gradient(140deg,#fff 0%,#fff8fc 100%);border-color:#f4d4e5}
.context-chip{display:inline-block;font-size:9px;font-weight:900;color:#c33e87;background:#ffe3f1;padding:5px 7px;border-radius:6px;margin-bottom:10px}
.action-footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
/* Event and live */
.event-layout{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(420px,1.4fr);gap:18px}
.event-scene{padding:24px;background:linear-gradient(150deg,#fff,#f2f6ff);position:relative;overflow:hidden;min-height:350px}
.event-scene:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #dce7ff;border-radius:50%;right:-80px;bottom:-90px;box-shadow:0 0 0 25px rgba(230,239,255,.4),0 0 0 55px rgba(255,229,243,.3)}
.event-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--pink-soft);color:#d13f8d;font-size:25px;margin:22px 0}
.event-copy{position:relative;z-index:1;max-width:440px}
.event-copy p{font-size:13px;color:#68738d}
.event-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.event-meta span{font-size:10px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;color:#7c879e;background:#fff}
.hand-panel{padding:20px}
.hand-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid #dfe4ef;border-radius:15px;background:#fff;text-align:left;padding:14px;min-height:155px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:.15s}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.card.memory:before{background:var(--pink)}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(41,56,93,.10);border-color:#b8caff}
.card-type{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--blue)}
.card.memory .card-type{color:#d43f91}
.card-title{font-weight:900;font-size:14px;line-height:1.35}
.card-desc{font-size:11px;color:#66728c;line-height:1.5}
.card-hint{font-size:10px;color:#9a6c8a;line-height:1.5;margin-top:auto}
.hand-note{font-size:10px;color:var(--muted);margin:13px 0 0}
.live-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.8fr);gap:16px}
.live-stage{overflow:hidden;background:#11182c;border-radius:22px;color:#fff;box-shadow:var(--shadow)}
.live-top{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;background:#1a2440}
.live-top strong{font-size:13px}
.live-top .live-badge{background:#ff386f}
.live-screen{min-height:300px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 35%,#e4eaff 0%,#9fb9ef 22%,#35476e 54%,#151b30 100%);overflow:hidden}
.live-screen .avatar-halo{width:220px;height:220px;background:linear-gradient(140deg,#d9e7ff,#ffcce6)}
.live-screen .avatar{transform:scale(1.16);transform-origin:center}
.live-overlay{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;align-items:end;z-index:4}
.live-overlay strong{font-size:14px}.live-overlay small{display:block;font-size:10px;color:#cbd6f2;margin-top:4px}
.live-counter{font-size:11px;color:#dce5ff;background:rgba(14,20,39,.6);padding:7px 9px;border-radius:8px}
.live-chat{padding:16px 18px;background:#171f36}
.chat-title{font-size:10px;letter-spacing:.15em;color:#aab9e4;font-weight:900;margin-bottom:10px}
.chat-lines{display:flex;flex-direction:column;gap:8px}
.chat-line{font-size:11px;color:#dbe3fa;line-height:1.5}
.chat-line b{color:#7fc6ff;margin-right:6px}
.live-right{display:flex;flex-direction:column;gap:14px}
.live-event-card{padding:19px;border:1px solid #dbe4f7;background:#fff;border-radius:18px}
.live-event-card p{font-size:12px;color:#6c7791;margin-bottom:0}
.live-hand{padding:18px}
.live-hand .hand{grid-template-columns:1fr}
.live-hand .card{min-height:108px}
/* Result, memory, archive, summary */
.result-wrap{max-width:900px;margin:0 auto}
.result-banner{padding:28px;background:linear-gradient(110deg,#fff,#fff4fa 50%,#eef4ff);border:1px solid #f0d5e5;border-radius:23px;box-shadow:var(--shadow);margin-bottom:16px}
.result-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}
.result-feedback{padding:22px}
.change-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.change-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0f6;font-size:12px}
.change-row strong{color:#2c9b79}
.memory-intro{max-width:820px;margin:0 auto 20px}
.memory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.memory-choice{padding:0;text-align:left;border-radius:19px;background:#fff;border:1px solid #e1e5ef;overflow:hidden;transition:.15s}
.memory-choice:hover{transform:translateY(-3px);border-color:#ff9bce;box-shadow:0 14px 30px rgba(255,78,170,.12)}
.memory-art{height:95px;display:grid;place-items:center;background:linear-gradient(140deg,#fce5f2,#e7efff);font-size:30px;color:#a66db8}
.memory-body{padding:17px}
.memory-body h3{font-size:15px}
.memory-body p{font-size:11px;color:var(--muted);line-height:1.6}
.memory-loss{font-size:10px;color:#cc3f88;font-weight:900;margin-top:13px}
.archive-panel{max-width:750px;margin:20px auto;padding:clamp(25px,5vw,55px);text-align:center;background:linear-gradient(150deg,#fff,#f4f7ff 65%,#fff2f9);border-radius:26px;border:1px solid #dfe5f2;box-shadow:var(--shadow)}
.archive-disc{width:135px;height:135px;margin:0 auto 24px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff,#d8e5ff,#fff,#ffd9eb,#fff,#d8e5ff);border:1px solid #e2e6f0;box-shadow:0 12px 35px rgba(70,91,145,.14);position:relative}
.archive-disc:before{content:"";width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #dbe2ef}
.archive-disc:after{content:"";position:absolute;width:85px;height:2px;background:var(--pink);transform:rotate(-32deg)}
.version-line{font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:900}
.summary-hero{padding:26px;background:linear-gradient(110deg,#fff,#f0f5ff);border-radius:22px;border:1px solid #dfe6f4;margin-bottom:16px}
.summary-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.summary-stat{padding:16px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.summary-stat span{font-size:10px;color:var(--muted);font-weight:800;display:block}
.summary-stat strong{display:block;font-size:22px;margin-top:6px}
.ending-screen{min-height:70vh;display:grid;place-items:center;padding:30px 15px}
.ending-card{max-width:760px;width:100%;padding:clamp(30px,6vw,65px);border-radius:28px;background:linear-gradient(145deg,#fff,#fff0f8 48%,#eaf1ff);text-align:center;border:1px solid #e3d9ed;box-shadow:0 30px 90px rgba(40,50,90,.14)}
.ending-mark{width:80px;height:80px;border-radius:25px;margin:0 auto 24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;font-size:34px}
.ending-card h1{font-size:clamp(34px,6vw,58px)}
/* Library and modal */
.library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.library-grid .card{cursor:default}
.modal-backdrop{position:fixed;inset:0;z-index:30;background:rgba(24,31,52,.45);display:grid;place-items:center;padding:20px}
.modal{width:min(500px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 80px rgba(15,25,50,.25)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.footer-note{font-size:10px;color:#9aa3b5;margin-top:24px;text-align:center}
@media(max-width:1080px){
 .work-grid{grid-template-columns:minmax(220px,.8fr) minmax(330px,1.2fr)}
 .work-grid>.col-stack:last-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}
 .event-layout{grid-template-columns:1fr}.event-scene{min-height:280px}
 .memory-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
 .topbar{height:62px}.top-right .pill:nth-child(2){display:none}
 .start-shell{grid-template-columns:1fr}.start-art{min-height:240px;grid-row:1}.disc{width:180px;height:180px}.orbit{width:300px;height:300px}.orbit.two{width:230px;height:340px}
 .start-copy{padding:28px}.logo-title{font-size:60px;margin:15px 0}

<div id="app"></div>
<script>
const CARD_DATA = [
 {id:"joke",name:"顺势玩梗",type:"普通牌",desc:"把突发状况变成节目效果。",hint:"容易吸引围观，但未必人人都喜欢这个玩笑。",tags:["humor","mistake","awkward"],effect:"heat"},
 {id:"explain",name:"认真解释",type:"普通牌",desc:"把事情的来龙去脉说清楚。",hint:"坦诚往往能留下真正愿意相信你的人。",tags:["trust","question","controversy","business"],effect:"trust"},
 {id:"redirect",name:"转移话题",type:"普通牌",desc:"把注意力带回当下的内容。",hint:"有些事情不必成为今天直播的主角。",tags:["defense","controversy","troll"],effect:"defense"},
 {id:"hard",name:"正面硬刚",type:"普通牌",desc:"清晰地表达立场，不回避冲突。",hint:"态度足够鲜明，也意味着有人会站到你的对面。",tags:["controversy","troll","conflict"],effect:"conflict"},
 {id:"selfjoke",name:"自我调侃",type:"普通牌",desc:"先把自己的小失误讲成笑点。",hint:"先笑自己的人，常常能让尴尬变得没那么重要。",tags:["humor","mistake","awkward"],effect:"calm"},
 {id:"silent",name:"保持沉默",type:"普通牌",desc:"不接话，让争论失去舞台。",hint:"不回应也会被理解成一种态度。",tags:["defense","troll","controversy"],effect:"defense"},
 {id:"apology",name:"主动认错",type:"普通牌",desc:"承认失误，并说明接下来怎么处理。",hint:"承担责任可能换来更长久的信任。",tags:["mistake","business","trust"],effect:"apology"},
 {id:"freeplay",name:"自由发挥",type:"普通牌",desc:"暂时放下准备好的答案，让她自己回应。",hint:"看看她自己会怎么处理，结果受人格状态影响。",tags:["stage","highlight","live"],effect:"free"},
 {id:"end",name:"及时收场",type:"普通牌",desc:"在合适的时机结束当前话题。",hint:"最热闹的时候离开，也许刚刚好。",tags:["defense","controversy","wrap"],effect:"end"},
 {id:"memory147",name:"《那晚只有147个人》",type:"记忆牌",desc:"她还记得，最初为什么愿意继续说下去。",hint:"回应坚持与陪伴相关的事件。",tags:["perseverance","loneliness","fan","trust"],effect:"memory",memoryId:"m147"},
 {id:"memory10000",name:"《第一次万人直播》",type:"记忆牌",desc:"她已经经历过一次这样的紧张。",hint:"重大场合到来时，这段经历仍能派上用场。",tags:["stage","live","pressure","highlight"],effect:"memory",memoryId:"m10000"},
 {id:"memoryWords",name:"《那次没说出口的话》",type:"记忆牌",desc:"有些回答，她已经在心里准备了很久。",hint:"回应质疑、情感或自我身份相关事件。",tags:["question","identity","trust"],effect:"memory",memoryId:"mwords"}
];
const MEMORY_DATA = [
 {id:"m147",title:"那晚只有147个人",detail:"很久以前，她面对着寥寥无几的观众，仍然把整场直播认真地做完。",cardId:"memory147",impact:"删除后，《那晚只有147个人》记忆牌将永久失效。"},
 {id:"m10000",title:"第一次万人直播",detail:"第一次看见同时在线人数越过五位数时，她紧张得差点忘记准备好的开场白。",cardId:"memory10000",impact:"删除后，《第一次万人直播》记忆牌将永久失效。"},
 {id:"mwords",title:"那次没说出口的话",detail:"那次她最终没有说出口的回答，仍留在这段经历的边缘。",cardId:"memoryWords",impact:"删除后，《那次没说出口的话》记忆牌将永久失效。"}
];
const ACTION_EVENTS = {
 training:[
  {title:"练习室里的小失误",desc:"新编排第一次完整走下来，她在最后一个动作上慢了半拍。有人把片段发到了粉丝群里。",tags:["mistake","humor","stage"],icon:"✦",kind:"训练"},
  {title:"临时加练的提议",desc:"团队建议再加一轮高强度训练。她没有拒绝，只是抬头看了一眼墙上的倒计时。",tags:["pressure","stage","perseverance"],icon:"⌁",kind:"训练"}
 ],
 collab:[
  {title:"合作对象突然提问",desc:"联动刚开始，对方忽然把一个没有提前对过的问题抛给她。直播间的气氛一下变得微妙。",tags:["question","interaction","trust"],icon:"↗",kind:"联动"},
  {title:"谁来决定下一首歌？",desc:"两边的观众各自刷起了想看的内容，弹幕很快分成了两派。",tags:["interaction","fan","controversy"],icon:"♫",kind:"联动"}
 ],
 business:[
  {title:"品牌方临时调整口播",desc:"对方发来消息，希望她临时增加一段宣传内容。距离正式直播只剩下不多的时间。",tags:["business","trust","pressure"],icon:"◇",kind:"商务"},
  {title:"商品细节被观众追问",desc:"有人指出商品介绍里有一处没有说清楚，越来越多观众开始询问具体情况。",tags:["business","question","controversy"],icon:"▧",kind:"商务"}
 ],
 post:[
  {title:"直播结束后的留言",desc:"直播间关闭了，但后台还有一条留言持续被转发。团队问她要不要再回应一次。",tags:["wrap","trust","controversy"],icon:"◷",kind:"直播后续"}
 ]
};
const LIVE_EVENTS = [
 {title:"弹幕突然刷起同一个问题",desc:"有人问起她以前从不提及的一段经历。起初只是零星几条，随后整片弹幕都开始重复同一个问题。",tags:["question","identity","controversy","trust"],icon:"?",kind:"直播事件"},
 {title:"一句话说错了",desc:"她把一句准备好的话说反了。弹幕迅速分成了几种声音，有人觉得好笑，也有人开始质疑她的状态。",tags:["mistake","humor","stage","controversy"],icon:"!",kind:"直播事件"}
];
const FINAL_EVENT = {title:"恒星计划 · 最终发言",desc:"舞台灯光逐渐暗下去，主持人把最后一个问题留给她。此刻，能替她作出回应的只剩下你手里的牌，以及她还记得的那些事。",tags:["stage","pressure","live","identity","trust"],icon:"✧",kind:"最终竞演"};

let state;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function freshState(){
 const s={scene:"start",day:1,deadline:7,archiveVersion:1,stats:{fans:12680,rank:18,stability:74,memory:68},
  hidden:{core:1200,regular:10200,antis:1280},completedSlots:0,slotActions:[],liveStarted:false,liveCompleted:false,postDone:false,
  memories:MEMORY_DATA.map(m=>({...m,kept:true})),deck:[],discard:[],hand:[],currentEvent:null,afterEvent:null,actionContext:null,
  eventOutcome:null,pendingNext:null,settingsOpen:false,previousScene:"workbench",removedMemory:null};
 s.deck=shuffle(CARD_DATA.map(c=>c.id));s.hand=drawFrom(s,4);return s;
}
function drawFrom(s,count){
 const out=[];
 for(let i=0;i<count;i++){
  if(s.deck.length===0){if(s.discard.length===0)break;s.deck=shuffle(s.discard);s.discard=[];}
  const id=s.deck.pop();if(id && !out.includes(id))out.push(id);
 }
 return out;
}
function cardById(id){return CARD_DATA.find(c=>c.id===id);}
function availableCards(){const removed=state.memories.filter(m=>!m.kept).map(m=>m.cardId);return CARD_DATA.filter(c=>!removed.includes(c.id));}
function refillHand(count=1){
 const availableIds=new Set(availableCards().map(c=>c.id));
 state.deck=state.deck.filter(id=>availableIds.has(id));state.discard=state.discard.filter(id=>availableIds.has(id));state.hand=state.hand.filter(id=>availableIds.has(id));
 const needed=Math.min(count,4-state.hand.length);if(needed>0)state.hand.push(...drawFrom(state,needed));
}
function recalcRank(){state.stats.rank=Math.max(1,Math.round(31-state.stats.fans/1000-(state.stats.stability-50)/20));}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,n));}
function startGame(){state=freshState();state.scene="workbench";render();}
function setScene(scene){state.scene=scene;render();}
function openAction(type){
 if(state.completedSlots>=4||state.liveCompleted)return;
 const list=ACTION_EVENTS[type];const ev=list[Math.floor(Math.random()*list.length)];
 state.actionContext={phase:"pre",type,slot:state.completedSlots};
 state.afterEvent="workbench";openEvent(ev);
}
function enterLive(){
 if(state.liveCompleted)return;
 state.liveStarted=true;state.actionContext={phase:"live",type:"直播",slot:null};state.liveEventIndex=0;
 openEvent(LIVE_EVENTS[0]);
}
function startPostLive(){
 if(!state.liveCompleted||state.postDone)return;
 state.actionContext={phase:"post",type:"直播后续",slot:null};state.afterEvent="daySummary";
 const ev=ACTION_EVENTS.post[0];openEvent(ev);
}
function openFinal(){
 state.actionContext={phase:"final",type:"最终竞演",slot:null};state.afterEvent="ending";openEvent(FINAL_EVENT);
}
function openEvent(ev){
 state.currentEvent=ev;state.eventOutcome=null;
 if(state.hand.length<4)refillHand(4-state.hand.length);
 state.scene=state.actionContext && state.actionContext.phase==="live"?"live":"event";
 render();
}
function playCard(id){
 const c=cardById(id);if(!c||!state.hand.includes(id))return;
 const ev=state.currentEvent;const matched=c.tags.some(t=>ev.tags.includes(t));
 let fanDelta=0,stabDelta=0,memDelta=0,feedback="",tone="mixed";
 switch(c.effect){
  case "heat": fanDelta=matched?330:210;stabDelta=-4;memDelta=12;feedback=matched?"她顺势把失误接成了节目效果，直播间热度迅速上升。":"话题确实热闹起来了，但部分观众觉得回应有些刻意。";tone=matched?"good":"mixed";break;
  case "trust": fanDelta=matched?180:70;stabDelta=matched?6:2;memDelta=8;feedback=matched?"解释击中了观众真正关心的部分，一些质疑慢慢平息。":"她把话说清楚了，但眼下的观众未必都愿意听完。";tone=matched?"good":"mixed";break;
  case "defense": fanDelta=matched?100:35;stabDelta=matched?4:0;memDelta=5;feedback=matched?"话题没有继续失控，注意力逐渐回到原本的内容。":"争论暂时停了一下，仍有少量观众不肯放过这个话题。";tone=matched?"good":"mixed";break;
  case "conflict": fanDelta=matched?360:170;stabDelta=-10;memDelta=14;feedback=matched?"鲜明的态度迅速引来围观，也把立场不同的人推到了对面。":"回应比事件本身更受关注，讨论开始朝不可控的方向扩散。";tone="risky";break;
  case "calm": fanDelta=matched?150:80;stabDelta=8;memDelta=4;feedback=matched?"她把尴尬化成了轻松的笑点，弹幕气氛重新活跃起来。":"气氛稍微缓和了，但没有完全转移观众的注意力。";tone="good";break;
  case "apology": fanDelta=matched?90:-60;stabDelta=matched?10:3;memDelta=7;feedback=matched?"她明确承担了该承担的部分，观众开始重新评估这件事。":"她主动认错了，但有些观众认为这次回应并没有解决核心问题。";tone=matched?"good":"mixed";break;
  case "free": fanDelta=state.stats.stability>=60?230:40;stabDelta=state.stats.stability>=60?3:-8;memDelta=10;feedback=state.stats.stability>=60?"她临场接住了这个问题，表现出超出准备稿的灵气。":"她自由发挥时显得有些犹豫，团队也无法预测后续反响。";tone=state.stats.stability>=60?"good":"risky";break;
  case "end": fanDelta=matched?55:20;stabDelta=5;memDelta=2;feedback=matched?"她及时结束了争论，给观众留下继续关注后续内容的空间。":"话题被收住了，但仍有观众把沉默理解成另一种态度。";tone="good";break;
  case "memory":
   if(c.id==="memory147"){fanDelta=matched?190:80;stabDelta=9;memDelta=4;feedback=matched?"那段最初的记忆让她重新找回了继续说下去的理由。":"她想起了曾经的自己，语气比刚才坚定了一些。";}
   else if(c.id==="memory10000"){fanDelta=matched?250:110;stabDelta=10;memDelta=5;feedback=matched?"熟悉的紧张感再次出现，但她知道自己已经走过一次。":"这段记忆给了她一点底气，足以让她继续面对眼前的场面。";}
   else{fanDelta=matched?170:70;stabDelta=7;memDelta=3;feedback=matched?"那句曾经没说出口的话终于有了回应，她的表达清晰了许多。":"她似乎触碰到了那段经历，却仍然没有完全说出心里的答案。";}
   tone="memory";break;
 }
 if(matched && !["conflict","memory"].includes(c.effect)){fanDelta+=45;}
 state.stats.fans=Math.max(0,state.stats.fans+fanDelta);
 state.stats.stability=clamp(state.stats.stability+stabDelta);
 state.stats.memory=clamp(state.stats.memory+memDelta,0,100);
 if(matched){state.hidden.core+=Math.max(0,Math.round(fanDelta*.2));state.hidden.regular+=Math.max(0,Math.round(fanDelta*.7));}
 else if(c.effect==="conflict"){state.hidden.antis+=Math.round(Math.max(0,fanDelta)*.25);}
 else{state.hidden.regular+=Math.max(0,Math.round(fanDelta*.6));}
 recalcRank();
 state.hand=state.hand.filter(x=>x!==id);
 if(!c.oneUse)state.discard.push(id);
 state.eventOutcome={card:c,matched,fanDelta,stabDelta,memDelta,feedback,tone,eventTitle:ev.title};
 state.scene="result";render();
}
function continueResult(){
 const next=state.afterEvent||"workbench";
 if(state.stats.memory>=100){state.pendingNext=next;state.scene="memory";render();return;}
 continueFlow(next);
}
function continueFlow(next){
 state.eventOutcome=null;
 if(next==="workbench"){
  if(state.actionContext&&state.actionContext.phase==="pre"){
   state.slotActions[state.completedSlots]=state.actionContext.type;state.completedSlots=Math.min(4,state.completedSlots+1);
  }
  refillHand(1);state.actionContext=null;state.scene="workbench";
 }else if(next==="nextLiveEvent"){
  state.liveEventIndex=(state.liveEventIndex||0)+1;
  if(state.liveEventIndex<LIVE_EVENTS.length){refillHand(1);openEvent(LIVE_EVENTS[state.liveEventIndex]);return;}
  state.liveCompleted=true;state.actionContext=null;state.scene="workbench";
 }else if(next==="daySummary"){
  state.postDone=true;state.actionContext=null;state.scene="daySummary";
 }else if(next==="ending"){
  state.scene="ending";
 }else{
  state.scene="workbench";
 }
 render();
}
function deleteMemory(id){
 const m=state.memories.find(x=>x.id===id);if(!m||!m.kept)return;
 m.kept=false;state.removedMemory=m;
 const removedId=m.cardId;
 state.hand=state.hand.filter(x=>x!==removedId);
 state.deck=state.deck.filter(x=>x!==removedId);
 state.discard=state.discard.filter(x=>x!==removedId);
 state.stats.memory=28;
 state.stats.stability=clamp(state.stats.stability-7);
 state.archiveVersion++;
 state.scene="archive";render();
}
function afterArchive(){
 const next=state.pendingNext||"workbench";state.pendingNext=null;
 continueFlow(next);
}
function nextDay(){
 if(state.day>=3){openFinal();return;}
 state.day++;state.deadline=Math.max(0,state.deadline-1);state.completedSlots=0;state.slotActions=[];state.liveStarted=false;state.liveCompleted=false;state.postDone=false;state.actionContext=null;state.currentEvent=null;state.scene="workbench";refillHand(4-state.hand.length);render();
}
function chooseEnding(){
 const kept=state.memories.filter(m=>m.kept).length;
 if(state.stats.rank<=10&&kept>=2)return {title:"《我还记得》",sub:"赢下恒星计划，也留下了足够多属于她自己的记忆。",body:"聚光灯落下时，她仍然记得最初的观众、第一次站上大舞台的紧张，以及那些曾经没能说出口的话。她赢得了比赛，也保留了能够回答“我是谁”的线索。"};
 if(state.stats.rank<=10&&kept<2)return {title:"《最完美的版本》",sub:"她站上了最高处，却已经很难说清一路走来的自己。",body:"所有指标都指向成功。掌声、排名与商业邀约接踵而至。只是当有人提起过去，她只能看着那些空缺，像在阅读一份不属于自己的档案。"};
 if(kept>=2)return {title:"《恒星之后》",sub:"比赛有了结果，故事却没有在这里结束。",body:"她没有站上最终的第一名，但仍然记得自己为什么出发。那些没被优化掉的经历，成了她继续走下去的依据。"};
 return {title:"《新版本》",sub:"一切都可以重新开始，只是有些东西已经无法找回。",body:"新版本的她仍会开播、训练、与观众相遇。团队为她准备了更高效的流程，却再也无法从她那里听到那些已经被删除的故事。"};
}
function restart(){state=freshState();render();}
function showLibrary(){state.previousScene=state.scene;state.scene="library";render();}
function backFromLibrary(){state.scene=state.previousScene||"workbench";render();}
function toggleSettings(){state.settingsOpen=!state.settingsOpen;render();}
function goStart(){state.scene="start";render();}
function statusBar(label,value,cls){return `<div class="stat-row"><span class="label">${label}</span><strong>${value}%</strong></div><div class="bar ${cls}"><span style="width:${value}%"></span></div>`;}
function header(){
 return `<header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div>偶像存档中！<small>IDOL SAVING...</small></div></div><div class="top-right"><span class="pill"><i class="dot"></i> 原型演示版</span><span class="pill">V${state.archiveVersion} · 存档已更新</span></div></header>`;
}
function avatarMarkup(){return `<div class="avatar-halo"></div><div class="avatar"><div class="avatar-hair"></div><div class="avatar-bow"></div><div class="avatar-crown">♛</div><div class="avatar-face"></div><div class="avatar-body"></div></div>`;}
function startPage(){
 return `<main class="start-page"><div class="start-shell"><section class="start-copy"><div class="eyebrow">A STORY ABOUT MEMORY & IDENTITY</div><div class="logo-title"><span class="line1">偶像</span><span class="line2">存档中！</span></div><div class="logo-sub">IDOL SAVING...</div><p style="margin-top:25px;color:#66718b;max-width:390px">距离「恒星计划」最终竞演，还有七天。<br>安排她的每一天，也决定哪些记忆能够留下。</p><div class="start-actions"><button class="btn btn-primary" onclick="startGame()">开始游戏 <span>→</span></button><button class="btn btn-soft" onclick="alert('这是流程原型，当前没有可继续的本地存档。')">继续游戏</button></div><div class="start-note">交互流程原型 · 数值为演示用 · 点击按钮即可体验一轮主要流程</div></section><section class="start-art"><div class="orbit"></div><div class="orbit two"></div><div class="disc"></div><span class="star s1">✦</span><span class="star s2">✧</span><div class="art-caption">ARCHIVE / 001</div></section></div></main>`;
}
function workbench(){
 const slotTimes=["11:00—13:00","13:00—15:00","15:00—17:00","17:00—18:00"];
 const slotNames=["第一段日程","第二段日程","第三段日程","直播前准备"];
 const actions=["training","collab","business","training"];
 const actionNames={training:"训练",collab:"联动",business:"商务"};
 let schedule=slotTimes.map((t,i)=>{
  const done=i<state.completedSlots;const active=i===state.completedSlots&&state.completedSlots<4;
  const name=done?(state.slotActions[i]||actionNames[actions[i]]):slotNames[i];
  return `<div class="schedule-row ${done?"done":active?"active":""}"><div class="schedule-time">${t}</div><div><div class="schedule-name">${name}</div><div class="schedule-state">${done?"行动已完成":active?"可以安排行动":"等待中"}</div></div><span class="state-tag">${done?"完成":active?"当前":"未开始"}</span></div>`;
 }).join("");
 schedule+=`<div class="schedule-row fixed ${state.liveCompleted?"done":""}"><div class="schedule-time">18:00—24:00</div><div><div class="schedule-name">直播 · 固定时段</div><div class="schedule-state">${state.liveCompleted?"直播已结束":state.liveStarted?"直播进行中":"到点开启"}</div></div><span class="state-tag">${state.liveCompleted?"完成":"固定"}</span></div>`;
